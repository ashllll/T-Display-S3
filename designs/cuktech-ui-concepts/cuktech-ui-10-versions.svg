<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1140" viewBox="0 0 700 1140" role="img" aria-labelledby="title desc">
  <title id="title">CUKTECH network monitor UI concepts</title>
  <desc id="desc">Ten 320 by 170 landscape UI concepts for the T-Display-S3 iKuai network monitor.</desc>
  <style>
    .sheet{fill:#111}
    .screen{fill:#000;stroke:#2a2f35;stroke-width:1}
    .text{font-family:'D-DIN','Bahnschrift','Rajdhani',Arial,sans-serif;fill:#f5f7fa}
    .dim{fill:#8a93a3}
    .idle{fill:#4a5260}
    .cyan{fill:#37c4d6}.blue{fill:#3fa9f5}.orange{fill:#ff7a1a}
    .green{fill:#36d27e}.red{fill:#ff4057}.yellow{fill:#ffc800}
    .line{stroke:#1c222b;stroke-width:1}.curve-cyan{fill:none;stroke:#37c4d6;stroke-width:2}
    .curve-blue{fill:none;stroke:#3fa9f5;stroke-width:1.5}.curve-orange{fill:none;stroke:#ff7a1a;stroke-width:1.5}
    .tag{font-family:Arial,sans-serif;font-size:13px;font-weight:600;fill:#dfe5ed}
    .screen-label{font-family:Arial,sans-serif;font-size:13px;fill:#8a93a3}
  </style>
  <rect class="sheet" width="700" height="1140"/>

  <!-- 01 balanced monitor -->
  <g transform="translate(20 35)">
    <text class="screen-label" x="0" y="-12">01 · BALANCED MONITOR</text>
    <rect class="screen" width="320" height="170" rx="3"/>
    <circle class="green" cx="16" cy="13" r="3"/><text class="text" x="25" y="17" font-size="12">WAN ONLINE</text>
    <rect x="240" y="3" width="68" height="15" rx="8" fill="none" stroke="#ff7a1a"/><text class="orange" x="274" y="14" text-anchor="middle" font-size="10">PING 8 MS</text>
    <rect x="12" y="25" width="48" height="14" rx="7" class="cyan"/><text x="36" y="36" text-anchor="middle" font-size="10" fill="#000">DOWN</text>
    <rect x="172" y="25" width="32" height="14" rx="7" class="blue"/><text x="188" y="36" text-anchor="middle" font-size="10" fill="#000">UP</text>
    <text class="text" x="12" y="70" font-size="34" font-style="italic">9.36</text><text class="cyan" x="103" y="66" font-size="12">MB/s</text>
    <text class="text" x="172" y="70" font-size="34" font-style="italic">1.02</text><text class="blue" x="263" y="66" font-size="12">MB/s</text>
    <line class="line" x1="12" y1="82" x2="308" y2="82"/>
    <text class="dim" x="12" y="98" font-size="11">10S LIVE</text><path class="curve-cyan" d="M12 125 C40 102 58 110 82 120 S124 135 148 115 S193 100 218 118 S270 132 308 108"/>
    <path class="curve-blue" d="M12 142 C70 140 120 143 170 140 S260 142 308 139"/>
    <text class="dim" x="12" y="163" font-size="10">IP 192.168.9.2</text><text class="dim" x="308" y="163" text-anchor="end" font-size="10">IKUAI LIVE</text>
  </g>

  <!-- 02 down hero -->
  <g transform="translate(360 35)">
    <text class="screen-label" x="0" y="-12">02 · DOWNLOAD HERO</text>
    <rect class="screen" width="320" height="170" rx="3"/>
    <circle class="green" cx="16" cy="13" r="3"/><text class="text" x="25" y="17" font-size="12">WAN ONLINE</text><text class="orange" x="308" y="17" text-anchor="end" font-size="11">8 MS</text>
    <rect x="12" y="28" width="96" height="14" rx="7" class="cyan"/><text x="60" y="39" text-anchor="middle" font-size="10" fill="#000">TOTAL DOWN</text>
    <text class="text" x="160" y="91" text-anchor="middle" font-size="52" font-style="italic">9.36</text><text class="cyan" x="160" y="108" text-anchor="middle" font-size="12">MB/s</text>
    <text class="dim" x="12" y="133" font-size="12">UP 1.02 MB/s</text><text class="yellow" x="308" y="133" text-anchor="end" font-size="11">PEAK 11.8</text>
    <line class="line" x1="12" y1="144" x2="308" y2="144"/><path class="curve-cyan" d="M12 158 C58 150 83 160 120 153 S190 154 225 150 S275 160 308 151"/>
  </g>

  <!-- 03 dual lanes -->
  <g transform="translate(20 260)">
    <text class="screen-label" x="0" y="-12">03 · DUAL LANES</text>
    <rect class="screen" width="320" height="170" rx="3"/>
    <text class="dim" x="12" y="16" font-size="11">WAN ONLINE</text><text class="orange" x="308" y="16" text-anchor="end" font-size="11">PING 8 MS</text>
    <line class="line" x1="160" y1="26" x2="160" y2="144"/>
    <text class="cyan" x="24" y="45" font-size="11">DOWN</text><text class="text" x="24" y="83" font-size="36" font-style="italic">9.36</text><text class="cyan" x="24" y="101" font-size="11">MB/s</text>
    <path class="curve-cyan" d="M24 126 C47 110 62 130 83 116 S119 122 144 108"/>
    <text class="blue" x="176" y="45" font-size="11">UP</text><text class="text" x="176" y="83" font-size="36" font-style="italic">1.02</text><text class="blue" x="176" y="101" font-size="11">MB/s</text>
    <path class="curve-blue" d="M176 126 C201 122 224 128 244 119 S279 124 296 116"/>
    <text class="dim" x="12" y="161" font-size="10">10S LIVE</text><text class="dim" x="308" y="161" text-anchor="end" font-size="10">IP 192.168.9.2</text>
  </g>

  <!-- 04 trend first -->
  <g transform="translate(360 260)">
    <text class="screen-label" x="0" y="-12">04 · TREND FIRST</text>
    <rect class="screen" width="320" height="170" rx="3"/>
    <text class="dim" x="12" y="16" font-size="11">DOWN 9.36 MB/s</text><text class="blue" x="170" y="16" font-size="11">UP 1.02 MB/s</text><text class="orange" x="308" y="16" text-anchor="end" font-size="11">8 MS</text>
    <line class="line" x1="12" y1="25" x2="308" y2="25"/>
    <path d="M12 124 C36 92 56 111 79 96 S118 136 146 104 S194 86 218 109 S262 126 308 84 L308 145 L12 145 Z" fill="#37c4d6" opacity=".12"/>
    <path class="curve-cyan" d="M12 124 C36 92 56 111 79 96 S118 136 146 104 S194 86 218 109 S262 126 308 84"/>
    <path class="curve-blue" d="M12 137 C62 131 101 140 144 133 S223 139 308 128"/>
    <path class="curve-orange" d="M12 142 C74 141 101 143 141 140 S182 119 201 136 S255 141 308 138"/>
    <text class="dim" x="12" y="161" font-size="10">10S RANGE</text><text class="cyan" x="208" y="161" font-size="10">DOWN</text><text class="blue" x="253" y="161" font-size="10">UP</text><text class="orange" x="286" y="161" font-size="10">P</text>
  </g>

  <!-- 05 network health -->
  <g transform="translate(20 485)">
    <text class="screen-label" x="0" y="-12">05 · NETWORK HEALTH</text>
    <rect class="screen" width="320" height="170" rx="3"/>
    <text class="green" x="160" y="32" text-anchor="middle" font-size="12">● WAN ONLINE</text><text class="dim" x="160" y="53" text-anchor="middle" font-size="11">NETWORK STABLE</text>
    <text class="orange" x="52" y="92" text-anchor="middle" font-size="11">PING</text><text class="text" x="52" y="124" text-anchor="middle" font-size="31">8</text><text class="orange" x="52" y="140" text-anchor="middle" font-size="10">MS</text>
    <line class="line" x1="96" y1="76" x2="96" y2="145"/><text class="cyan" x="116" y="91" font-size="11">DOWN</text><text class="text" x="116" y="124" font-size="27" font-style="italic">9.36</text><text class="cyan" x="116" y="140" font-size="10">MB/s</text>
    <text class="blue" x="226" y="91" font-size="11">UP</text><text class="text" x="226" y="124" font-size="27" font-style="italic">1.02</text><text class="blue" x="226" y="140" font-size="10">MB/s</text>
    <line class="line" x1="12" y1="151" x2="308" y2="151"/><text class="dim" x="12" y="164" font-size="10">NO PACKET LOSS · 18 CLIENTS</text>
  </g>

  <!-- 06 client ranking -->
  <g transform="translate(360 485)">
    <text class="screen-label" x="0" y="-12">06 · CLIENT RANKING</text>
    <rect class="screen" width="320" height="170" rx="3"/>
    <text class="text" x="12" y="17" font-size="12">TOP CLIENTS</text><text class="dim" x="308" y="17" text-anchor="end" font-size="11">18 ONLINE</text>
    <line class="line" x1="12" y1="26" x2="308" y2="26"/>
    <rect x="12" y="37" width="24" height="14" rx="7" class="yellow"/><text x="24" y="48" text-anchor="middle" font-size="10" fill="#000">#1</text><text class="text" x="48" y="48" font-size="12">MacBook-Pro</text><text class="cyan" x="308" y="48" text-anchor="end" font-size="12">5.42 MB/s</text>
    <text class="dim" x="20" y="76" font-size="11">#2</text><text class="text" x="48" y="76" font-size="12">NAS</text><text class="cyan" x="308" y="76" text-anchor="end" font-size="12">2.31 MB/s</text>
    <text class="dim" x="20" y="104" font-size="11">#3</text><text class="text" x="48" y="104" font-size="12">iPhone</text><text class="cyan" x="308" y="104" text-anchor="end" font-size="12">0.86 MB/s</text>
    <line class="line" x1="12" y1="120" x2="308" y2="120"/><text class="dim" x="12" y="143" font-size="11">DOWN 9.36 MB/s</text><text class="blue" x="308" y="143" text-anchor="end" font-size="11">UP 1.02 MB/s</text>
    <text class="dim" x="12" y="162" font-size="10">NAMES CLIP AT 150 PX</text>
  </g>

  <!-- 07 dual wan -->
  <g transform="translate(20 710)">
    <text class="screen-label" x="0" y="-12">07 · DUAL WAN</text>
    <rect class="screen" width="320" height="170" rx="3"/>
    <text class="yellow" x="12" y="17" font-size="11">WAN 1</text><text class="green" x="148" y="17" font-size="11">● ONLINE</text><text class="dim" x="308" y="17" text-anchor="end" font-size="11">PRIMARY</text>
    <line class="line" x1="12" y1="26" x2="308" y2="26"/><text class="dim" x="12" y="44" font-size="10">IP</text><text class="text" x="60" y="44" font-size="11">192.168.1.2</text><text class="orange" x="308" y="44" text-anchor="end" font-size="11">PING 8 MS</text>
    <text class="cyan" x="12" y="66" font-size="10">DOWN</text><text class="text" x="60" y="66" font-size="12">8.42 MB/s</text><text class="blue" x="170" y="66" font-size="10">UP</text><text class="text" x="205" y="66" font-size="12">0.94 MB/s</text>
    <text class="dim" x="12" y="94" font-size="11">WAN 2</text><text class="red" x="148" y="94" font-size="11">● OFFLINE</text><text class="dim" x="308" y="94" text-anchor="end" font-size="11">BACKUP</text>
    <line class="line" x1="12" y1="103" x2="308" y2="103"/><text class="idle" x="12" y="122" font-size="10">IP --</text><text class="idle" x="308" y="122" text-anchor="end" font-size="10">TIMEOUT</text>
    <text class="text" x="12" y="156" font-size="13">TOTAL DOWN 9.36 MB/s</text>
  </g>

  <!-- 08 router health -->
  <g transform="translate(360 710)">
    <text class="screen-label" x="0" y="-12">08 · ROUTER HEALTH</text>
    <rect class="screen" width="320" height="170" rx="3"/>
    <text class="text" x="12" y="17" font-size="12">ROUTER HEALTH</text><text class="green" x="308" y="17" text-anchor="end" font-size="11">ONLINE</text>
    <text class="dim" x="12" y="46" font-size="10">CPU</text><text class="text" x="12" y="79" font-size="31" font-style="italic">24%</text><text class="dim" x="172" y="46" font-size="10">MEM</text><text class="text" x="172" y="79" font-size="31" font-style="italic">38%</text>
    <line class="line" x1="12" y1="92" x2="308" y2="92"/><text class="orange" x="12" y="116" font-size="11">TEMP 46°C</text><text class="cyan" x="122" y="116" font-size="11">CLIENTS 18</text><text class="blue" x="240" y="116" font-size="11">HEAP 186K</text>
    <text class="dim" x="12" y="145" font-size="11">DEVICE UP 7D 04H</text><text class="dim" x="308" y="145" text-anchor="end" font-size="11">v4.0.2</text>
    <text class="yellow" x="12" y="163" font-size="10">NO ACTIVE ALERTS</text>
  </g>

  <!-- 09 night quiet -->
  <g transform="translate(20 935)">
    <text class="screen-label" x="0" y="-12">09 · NIGHT QUIET</text>
    <rect class="screen" width="320" height="170" rx="3"/>
    <text class="dim" x="12" y="17" font-size="11">● ONLINE</text><text class="idle" x="308" y="17" text-anchor="end" font-size="11">23:42 · NIGHT</text>
    <text class="idle" x="12" y="55" font-size="10">DOWN</text><text class="text" x="12" y="96" font-size="42" font-style="italic">9.36</text><text class="idle" x="116" y="91" font-size="11">MB/s</text>
    <text class="dim" x="12" y="121" font-size="11">UP 1.02 MB/s</text><text class="idle" x="308" y="121" text-anchor="end" font-size="11">PING 8 MS</text>
    <line class="line" x1="12" y1="137" x2="308" y2="137"/><text class="idle" x="12" y="158" font-size="10">10S LIVE</text><text class="idle" x="308" y="158" text-anchor="end" font-size="10">LOW MOTION</text>
  </g>

  <!-- 10 one question carousel -->
  <g transform="translate(360 935)">
    <text class="screen-label" x="0" y="-12">10 · ONE QUESTION</text>
    <rect class="screen" width="320" height="170" rx="3"/>
    <text class="dim" x="12" y="17" font-size="11">PAGE 2 / 4</text><text class="cyan" x="308" y="17" text-anchor="end" font-size="11">THROUGHPUT</text>
    <line class="line" x1="12" y1="27" x2="308" y2="27"/>
    <text class="dim" x="160" y="62" text-anchor="middle" font-size="11">TOTAL DOWN</text><text class="text" x="160" y="111" text-anchor="middle" font-size="54" font-style="italic">9.36</text><text class="cyan" x="160" y="128" text-anchor="middle" font-size="12">MB/s</text>
    <text class="dim" x="12" y="157" font-size="10">SINGLE NEXT · DOUBLE HOME</text><circle class="idle" cx="244" cy="157" r="2"/><circle class="yellow" cx="252" cy="157" r="2"/><circle class="idle" cx="260" cy="157" r="2"/><circle class="idle" cx="268" cy="157" r="2"/>
  </g>
</svg>
