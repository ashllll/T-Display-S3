<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1280" viewBox="0 0 800 1280" role="img" aria-labelledby="title desc">
  <title id="title">T-Display-S3 iKuai monitor UI v2</title>
  <desc id="desc">A refined ten-page CUKTECH-inspired network monitor interface for a 320 by 170 screen.</desc>
  <style>
    .sheet{fill:#101318}.screen{fill:#000;stroke:#303844;stroke-width:1}
    .t{font-family:'D-DIN','Bahnschrift','Rajdhani',Arial,sans-serif;fill:#f5f7fa}
    .d{font-family:'D-DIN','Bahnschrift','Rajdhani',Arial,sans-serif;fill:#8a93a3}
    .i{font-family:'D-DIN','Bahnschrift','Rajdhani',Arial,sans-serif;fill:#4a5260}
    .c{fill:#37c4d6}.b{fill:#3fa9f5}.o{fill:#ff7a1a}.g{fill:#36d27e}.r{fill:#ff4057}.y{fill:#ffc800}
    .line{stroke:#1c222b;stroke-width:1}.guide{stroke:#25313e;stroke-width:1;opacity:.55}
    .cd{fill:none;stroke:#37c4d6;stroke-width:2}.bu{fill:none;stroke:#3fa9f5;stroke-width:1.5}.op{fill:none;stroke:#ff7a1a;stroke-width:1.5}
    .cap{font:600 13px Arial,sans-serif;fill:#9da8b8;letter-spacing:.3px}
    .tag{font:600 10px Arial,sans-serif;letter-spacing:.6px}
    .dots{fill:#3a4150}.dot-on{fill:#ffc800}
  </style>
  <rect class="sheet" width="800" height="1280"/>
  <text class="t" x="20" y="24" font-size="16" letter-spacing="1.2">T-DISPLAY-S3 · IKUAI MONITOR · UI V2</text>
  <text class="d" x="780" y="24" text-anchor="end" font-size="11">320 × 170 · NETWORK PROFILE · CUKTECH GRAMMAR</text>

  <!-- reusable ten-page navigation indicator -->
  <defs>
    <g id="dots"><circle class="dots" cx="0" cy="0" r="2"/><circle class="dots" cx="8" cy="0" r="2"/><circle class="dots" cx="16" cy="0" r="2"/><circle class="dots" cx="24" cy="0" r="2"/><circle class="dots" cx="32" cy="0" r="2"/><circle class="dots" cx="40" cy="0" r="2"/><circle class="dots" cx="48" cy="0" r="2"/><circle class="dots" cx="56" cy="0" r="2"/><circle class="dots" cx="64" cy="0" r="2"/><circle class="dot-on" cx="72" cy="0" r="2"/></g>
  </defs>

  <!-- 01 -->
  <g transform="translate(20 58)"><text class="cap" y="-10">01 · BALANCED OVERVIEW</text><rect class="screen" width="350" height="170" rx="3"/>
    <circle class="g" cx="16" cy="13" r="3"/><text class="t" x="25" y="17" font-size="11">WAN ONLINE</text><text class="o" x="338" y="17" text-anchor="end" font-size="10">PING 8 MS</text>
    <rect class="c" x="12" y="25" width="48" height="14" rx="7"/><text class="tag" x="36" y="35" text-anchor="middle" fill="#000">DOWN</text><rect class="b" x="188" y="25" width="32" height="14" rx="7"/><text class="tag" x="204" y="35" text-anchor="middle" fill="#000">UP</text>
    <text class="t" x="12" y="72" font-size="35" font-style="italic">9.36</text><text class="c" x="108" y="68" font-size="11">MB/s</text><text class="t" x="188" y="72" font-size="35" font-style="italic">1.02</text><text class="b" x="280" y="68" font-size="11">MB/s</text>
    <line class="line" x1="12" y1="83" x2="338" y2="83"/><text class="d" x="12" y="99" font-size="10">10S LIVE</text>
    <path class="cd" d="M12 132 C42 110 61 121 92 125 S142 143 178 117 S236 107 267 128 S310 133 338 112"/><path class="bu" d="M12 143 C80 139 122 145 177 141 S270 145 338 138"/>
    <text class="d" x="12" y="162" font-size="9">IP 192.168.9.2</text><text class="d" x="338" y="162" text-anchor="end" font-size="9">IKUAI LIVE</text><use href="#dots" x="250" y="162"/>
  </g>

