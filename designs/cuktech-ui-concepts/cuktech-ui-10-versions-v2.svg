    <rect class="c" x="12" y="30" width="48" height="14" rx="7"/><text class="tag" x="36" y="40" text-anchor="middle" fill="#000">DOWN</text><text class="t" x="12" y="82" font-size="37" font-style="italic">9.36</text><text class="c" x="12" y="101" font-size="10">MB/s</text><path class="cd" d="M12 130 C38 113 57 134 80 117 S121 126 164 107"/>
