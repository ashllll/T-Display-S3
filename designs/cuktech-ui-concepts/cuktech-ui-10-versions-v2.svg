    <text class="y" x="12" y="98" font-size="10">WAN 2</text><text class="r" x="100" y="98" font-size="10">● OFFLINE</text><text class="d" x="338" y="98" text-anchor="end" font-size="10">BACKUP</text><line class="line" x1="12" y1="108" x2="338" y2="108"/><text class="i" x="12" y="129" font-size="9">IP --</text><text class="i" x="338" y="129" text-anchor="end" font-size="9">GATEWAY --</text><text class="d" x="12" y="162" font-size="9">LINK STATUS IS TEXT + COLOR + DOT</text><use href="#dots" x="250" y="162"/>
